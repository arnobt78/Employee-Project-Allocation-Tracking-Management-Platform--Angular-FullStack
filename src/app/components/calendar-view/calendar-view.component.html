<app-calendar-month-shell
  [title]="title()"
  [days]="calendarDays()"
  [dayTemplate]="dayCell"
  (previous)="previousMonth()"
  (today)="goToToday()"
  (next)="nextMonth()"
></app-calendar-month-shell>

<ng-template #dayCell let-day>
  @if (day.events.length > 2) {
    <div
      [class]="
        'w-full rounded-xl border p-2 transition-all ' +
        dayCellTone(day) +
        (isDateExpanded(day.date) ? ' min-h-0' : ' min-h-[100px]')
      "
      (mouseenter)="cancelCollapse()"
      (mouseleave)="onMoreMouseLeave()"
      (keydown.escape)="collapse(); moreToggle.focus()"
    >
      <div class="mb-1 text-sm font-medium" [class]="dayNumberTone(day)">
        {{ day.day }}
      </div>
      <div class="space-y-1">
        @for (
          event of isDateExpanded(day.date) ? day.events : day.events.slice(0, 2);
          track $index
        ) {
          <ng-container
            [ngTemplateOutlet]="eventChip"
            [ngTemplateOutletContext]="{ $implicit: event }"
          ></ng-container>
        }
        <button
          #moreToggle
          type="button"
          class="rounded text-xs text-white/60 transition-colors hover:text-white focus-visible:text-white focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/40"
          [attr.aria-expanded]="isDateExpanded(day.date)"
          (pointerenter)="onMorePointerEnter($event, day.date)"
          (click)="toggleDateExpansion(day.date)"
        >
          {{ isDateExpanded(day.date) ? 'Show less' : '+' + (day.events.length - 2) + ' more' }}
        </button>
      </div>
    </div>
  } @else {
    <div
      [class]="
        'min-h-[100px] rounded-xl border p-2 transition-colors ' +
        dayCellTone(day)
      "
    >
      <div class="mb-1 text-sm font-medium" [class]="dayNumberTone(day)">
        {{ day.day }}
      </div>
      <div class="space-y-1">
        @for (event of day.events; track $index) {
          <ng-container
            [ngTemplateOutlet]="eventChip"
            [ngTemplateOutletContext]="{ $implicit: event }"
          ></ng-container>
        }
      </div>
    </div>
  }
</ng-template>

<ng-template #eventChip let-event>
  <a
    [routerLink]="['/update-project', event.projectId]"
    [attr.aria-label]="event.projectName + ': ' + event.title"
    [class]="
      'block rounded px-1.5 py-0.5 text-xs transition-colors hover:opacity-80 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white/50 ' +
      getEventTypeColor(event.type)
    "
  >
    <div class="truncate font-medium">{{ event.title }}</div>
    <div class="truncate text-xs opacity-75">
      {{ event.projectName }}
    </div>
  </a>
</ng-template>
