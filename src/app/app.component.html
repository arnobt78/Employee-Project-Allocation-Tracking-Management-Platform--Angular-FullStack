<div
  class="app-shell relative min-h-screen overflow-hidden bg-background bg-[radial-gradient(circle_at_top,_rgba(59,130,246,0.15),transparent_55%),radial-gradient(circle_at_bottom,_rgba(236,72,153,0.12),transparent_65%)]"
>
  <div
    class="pointer-events-none absolute inset-0 bg-[radial-gradient(circle_at_center,_rgba(255,255,255,0.05),transparent_60%)]"
  ></div>
  <div class="relative z-10 flex min-h-screen flex-col">
    @if (layout() === "private") {
      <app-shell-header />
    }

    <main
      class="flex-grow"
      [ngClass]="
        layout() === 'auth'
          ? 'px-0 py-0'
          : 'eh-shell-inner flex flex-col py-4'
      "
    >
      @if (showContentPlaceholder()) {
        <div
          class="eh-page"
          data-testid="early-route-placeholder"
          aria-busy="true"
        >
          <section
            class="rounded-[30px] border border-white/10 bg-white/5/80 p-2 shadow-[0_45px_120px_rgba(8,12,32,0.55)] backdrop-blur-md sm:p-4"
          >
            <app-route-content-placeholder />
          </section>
        </div>
      }
      <router-outlet
        (activate)="onRootActivate()"
        (deactivate)="onRootDeactivate()"
      />
    </main>

    @if (layout() === "private") {
      <app-shell-footer />
    }
  </div>
</div>
<app-toast-container />
