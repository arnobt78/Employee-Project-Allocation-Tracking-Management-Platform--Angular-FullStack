<div
  class="app-shell relative min-h-screen overflow-hidden bg-background bg-[radial-gradient(circle_at_top,_rgba(59,130,246,0.15),transparent_55%),radial-gradient(circle_at_bottom,_rgba(236,72,153,0.12),transparent_65%)]"
>
  <div
    class="pointer-events-none absolute inset-0 bg-[radial-gradient(circle_at_center,_rgba(255,255,255,0.05),transparent_60%)]"
  ></div>
  <div class="relative z-10 flex min-h-screen flex-col">
    @if (layout() === "private") {
      <app-shell-header />
    }

    <main
      class="flex-grow"
      [ngClass]="
        layout() === 'auth'
          ? 'px-0 py-0'
          : 'eh-shell-inner flex flex-col py-4'
      "
    >
      <router-outlet />
    </main>

    @if (layout() === "private") {
      <app-shell-footer />
    }
  </div>
</div>
<app-toast-container />
