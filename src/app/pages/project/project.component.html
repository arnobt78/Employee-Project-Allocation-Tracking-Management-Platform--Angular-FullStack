<app-list-page-shell
  [title]="pageMeta.title"
  [subtitle]="pageMeta.subtitle"
  [icon]="pageMeta.icon"
  [contentLoading]="isLoading()"
  [skeletonKpiCount]="6"
  [skeletonFilterCount]="2"
  [skeletonShowPagination]="true"
  skeletonRowVariant="project"
>
  <button
    listShellActions
    type="button"
    class="eh-action-btn eh-action-btn-primary"
    (click)="startCreate()"
  >
    <lucide-icon name="folder-kanban" [size]="14"></lucide-icon>
    <span>Add Project</span>
  </button>

  <app-kpi-stat-card
    listShellKpis
    label="Total projects"
    [value]="kpiTotal()"
    hint="All projects in the workspace"
    icon="folder-kanban"
    tone="sky"
  ></app-kpi-stat-card>
  <app-kpi-stat-card
    listShellKpis
    label="In flight"
    [value]="kpiInFlight()"
    hint="Approved, active, or in review"
    icon="zap"
    tone="emerald"
  ></app-kpi-stat-card>
  <app-kpi-stat-card
    listShellKpis
    label="Planning"
    [value]="kpiPlanning()"
    hint="Draft or planning"
    icon="pencil"
    tone="violet"
  ></app-kpi-stat-card>
  <app-kpi-stat-card
    listShellKpis
    label="On hold"
    [value]="kpiOnHold()"
    hint="Paused projects"
    icon="pause-circle"
    tone="amber"
  ></app-kpi-stat-card>
  <app-kpi-stat-card
    listShellKpis
    label="Archived"
    [value]="kpiArchived()"
    hint="Archived via archive date"
    icon="archive"
    tone="sky"
  ></app-kpi-stat-card>
  <app-kpi-stat-card
    listShellKpis
    label="Clients"
    [value]="kpiClients()"
    hint="Unique client names"
    icon="building-2"
    tone="emerald"
  ></app-kpi-stat-card>

  <app-list-toolbar
    listShellToolbar
    searchId="project-search"
    searchLabel="Search projects"
    searchPlaceholder="Search projects, clients, contact…"
    [searchValue]="searchTerm()"
    [menuFilters]="menuFilters()"
    [hasActiveFilters]="hasActiveFilters()"
    (searchChange)="updateSearch($event)"
    (menuFilterChange)="onMenuFilterChange($event)"
    (clearFilters)="clearListFilters()"
  >
    <app-list-pagination
      [page]="pagedProjects().page"
      [totalPages]="pagedProjects().totalPages"
      (pageChange)="goToPage($event)"
    ></app-list-pagination>
  </app-list-toolbar>

  <section class="space-y-4">
    <div
      *ngFor="let project of pagedProjects().items"
      class="overflow-hidden rounded-[28px] border border-white/10 bg-white/5/75 shadow-[0_30px_80px_rgba(10,15,35,0.5)] backdrop-blur-md transition hover:border-white/20"
    >
      <button
        type="button"
        class="flex w-full flex-col gap-3 px-3 py-3 text-left transition hover:bg-white/5 sm:flex-row sm:items-center sm:justify-between sm:px-4"
        (click)="toggleExpand(project.projectId)"
      >
        <div class="min-w-0 flex-1 space-y-2">
          <div
            class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between sm:gap-4"
          >
            <p class="truncate text-base font-medium text-white">
              {{ project.projectName }}
            </p>
            <div
              class="flex w-full max-w-[12rem] shrink-0 items-center gap-2 sm:max-w-[14rem]"
              (click)="$event.stopPropagation()"
            >
              <span
                class="shrink-0 text-xs font-medium text-white/70 sm:text-sm"
              >
                {{ readinessPercent(project) }}%
              </span>
              <div class="h-2 min-w-0 flex-1 rounded-full bg-white/10">
                <div
                  class="h-2 rounded-full bg-gradient-to-r from-sky-500 via-indigo-500 to-purple-500 transition-all duration-300"
                  [style.width.%]="readinessPercent(project)"
                ></div>
              </div>
            </div>
          </div>
          <div class="flex flex-wrap items-center gap-2">
            <span
              class="inline-flex items-center gap-1.5 rounded-full border px-3 py-1 text-xs capitalize sm:text-sm"
              [ngClass]="
                statusBadgeClasses(project.status || project.approvalStatus)
              "
            >
              <lucide-icon
                [name]="statusIcon(project.status || project.approvalStatus)"
                [size]="12"
              ></lucide-icon>
              {{ displayStatus(project) | titlecase }}
            </span>
            <span
              *ngIf="project.clientName"
              class="inline-flex items-center gap-1.5 rounded-full border border-white/15 bg-white/10 px-3 py-1 text-xs sm:text-sm text-white/70"
            >
              <lucide-icon name="building-2" [size]="12"></lucide-icon>
              {{ project.clientName }}
            </span>
            <span
              class="inline-flex items-center gap-1.5 text-xs sm:text-sm text-white/50"
            >
              <lucide-icon name="calendar" [size]="12"></lucide-icon>
              {{ dateRangeLabel(project) }}
            </span>
          </div>
        </div>
        <span
          class="shrink-0 text-xs sm:text-sm text-white/40 transition"
          [class.text-white]="expandedProjectId === project.projectId"
        >
          {{ expandedProjectId === project.projectId ? "Hide" : "More" }}
        </span>
      </button>

      <div
        *ngIf="expandedProjectId === project.projectId"
        class="border-t border-white/10 px-3 py-3 text-sm text-white/75 sm:px-4 sm:py-4"
        (click)="$event.stopPropagation()"
      >
        <div class="grid gap-4 sm:grid-cols-2">
          <div
            class="rounded-2xl border border-white/10 bg-white/5 px-2 py-3 sm:px-4"
          >
            <app-field-label text="Lead" icon="user"></app-field-label>
            <p class="text-base font-medium text-white">
              {{ project.employeeName || "—" }}
            </p>
          </div>
          <div
            class="rounded-2xl border border-white/10 bg-white/5 px-2 py-3 sm:px-4"
          >
            <app-field-label
              text="Contact"
              icon="contact"
            ></app-field-label>
            <p class="text-base font-medium text-white">
              {{ project.contactPerson || "—" }}
            </p>
          </div>
          <div
            class="rounded-2xl border border-white/10 bg-white/5 px-2 py-3 sm:px-4"
          >
            <app-field-label text="Email" icon="mail"></app-field-label>
            <p class="truncate text-base font-medium text-white">
              {{ project.emailId || "—" }}
            </p>
          </div>
          <div
            class="rounded-2xl border border-white/10 bg-white/5 px-2 py-3 sm:px-4"
          >
            <app-field-label text="Phone" icon="phone"></app-field-label>
            <p class="text-base font-medium text-white">
              {{ project.contactNo || "—" }}
            </p>
          </div>
          <div
            class="rounded-2xl border border-white/10 bg-white/5 px-2 py-3 sm:px-4"
          >
            <app-field-label
              text="Readiness"
              icon="activity"
            ></app-field-label>
            <p class="text-base font-medium text-white">
              {{ readinessPercent(project) }}%
            </p>
          </div>
          <div
            class="rounded-2xl border border-white/10 bg-white/5 px-2 py-3 sm:px-4"
          >
            <app-field-label text="Health" icon="activity"></app-field-label>
            <p class="text-base font-medium capitalize text-white">
              {{ (project.health || "—") | titlecase }}
            </p>
          </div>
          <div
            *ngIf="projectSummary(project)"
            class="sm:col-span-2 rounded-2xl border border-white/10 bg-white/5 px-2 py-3 sm:px-4"
          >
            <app-field-label
              text="Summary"
              icon="file-text"
            ></app-field-label>
            <p
              class="mt-1 line-clamp-3 text-sm leading-relaxed text-white/80"
            >
              {{ projectSummary(project) }}
            </p>
          </div>
          <div class="sm:col-span-2 flex flex-wrap justify-end gap-3">
            <a
              class="eh-action-btn eh-action-btn-outline"
              [routerLink]="['/update-project', project.projectId || 0]"
            >
              <lucide-icon name="panel-right" [size]="14"></lucide-icon>
              <span>Details</span>
            </a>
            <button
              type="button"
              class="eh-action-btn eh-action-btn-danger"
              (click)="onDelete(project.projectId)"
            >
              <lucide-icon name="trash-2" [size]="14"></lucide-icon>
              <span>Delete</span>
            </button>
          </div>
        </div>
      </div>

      <div
        *ngIf="expandedProjectId !== project.projectId"
        class="flex flex-wrap items-center justify-end gap-2 border-t border-white/10 px-3 py-2 sm:px-4"
      >
        <a
          class="eh-action-btn eh-action-btn-outline"
          [routerLink]="['/update-project', project.projectId || 0]"
          (click)="$event.stopPropagation()"
        >
          <lucide-icon name="panel-right" [size]="14"></lucide-icon>
          <span>Details</span>
        </a>
        <button
          type="button"
          class="eh-action-btn eh-action-btn-danger"
          (click)="onDelete(project.projectId); $event.stopPropagation()"
        >
          <lucide-icon name="trash-2" [size]="14"></lucide-icon>
          <span>Delete</span>
        </button>
      </div>
    </div>

    <div
      *ngIf="hasLoaded() && !filteredProjects().length"
      class="rounded-[28px] border border-dashed border-white/15 bg-white/5/60 px-2 py-12 text-center text-sm text-white/60 sm:px-4"
    >
      No projects match your filters.
    </div>
  </section>
</app-list-page-shell>

<app-alert-dialog
  [open]="!!pendingDelete"
  [title]="
    pendingDelete
      ? 'Delete ' + pendingDelete.projectName + '?'
      : 'Delete Project?'
  "
  description="This permanently removes the project and its assignments."
  confirmLabel="Delete Project"
  variant="destructive"
  [busy]="isDeleting"
  busyLabel="Deleting..."
  (confirmed)="confirmDelete()"
  (cancelled)="dismissDelete()"
></app-alert-dialog>
