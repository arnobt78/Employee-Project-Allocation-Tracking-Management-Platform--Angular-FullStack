<div class="mx-auto flex w-full max-w-9xl flex-col gap-8 px-4 py-8">
  <section
    class="rounded-[30px] border border-white/10 bg-white/5/75 px-2 sm:px-4 py-2 sm:py-4 shadow-[0_30px_80px_rgba(15,23,42,0.45)] backdrop-blur-xl"
  >
    <div
      class="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between"
    >
      <nav class="flex flex-wrap gap-2 text-sm font-medium">
        <a
          routerLink="/dashboard"
          routerLinkActive="is-active-tab"
          [routerLinkActiveOptions]="{ exact: true }"
          class="tab-pill"
        >
          Dashboard
        </a>
        <a
          routerLink="/employee"
          routerLinkActive="is-active-tab"
          class="tab-pill"
        >
          Employees
        </a>
        <a
          routerLink="/projects"
          routerLinkActive="is-active-tab"
          class="tab-pill"
        >
          Projects
        </a>
        <a
          routerLink="/project-employee"
          routerLinkActive="is-active-tab"
          class="tab-pill"
        >
          Project Team
        </a>
      </nav>
    </div>
  </section>

  <section
    class="rounded-[30px] border border-white/10 bg-white/5/80 py-2 sm:py-4 shadow-[0_45px_120px_rgba(8,12,32,0.55)] backdrop-blur-xl px-2 sm:px-4"
  >
    <router-outlet></router-outlet>
  </section>
</div>
